name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      # Report every failing version, not just the first.
      fail-fast: false
      matrix:
        # 22 is the minimum the README claims; 24 is what this is developed on.
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # --frozen-lockfile fails if the lockfile and package.json disagree,
      # which catches a dependency added without committing the lockfile.
      - name: Install
        run: pnpm install --frozen-lockfile

      # The apps import shared from dist, so it has to exist before they build.
      - name: Build shared package
        run: pnpm build:shared

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
